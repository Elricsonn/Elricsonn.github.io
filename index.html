  <style>
    /* Propre au lanceur : une page unique, centrée, sans en-tête ni navigation. */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--sp-5);
      padding: var(--sp-7) var(--sp-4);
      background-image: radial-gradient(ellipse at center, #1a130c 0%, var(--fond) 100%);
      background-attachment: fixed;
    }

    .marque {
      font-family: var(--font-orne);
      font-weight: 700;
      font-size: clamp(1.7rem, 7vw, 2.2rem);
      letter-spacing: 0.3em;
      margin-inline-end: -0.3em;
      text-transform: uppercase;
      color: var(--or);
      text-shadow: var(--lueur-titre);
      text-align: center;
    }

    /* Item flex centré : on retire l'avance du dernier glyphe. */
    header .meta { margin-inline-end: -0.2em; }

    .lanceur { width: 420px; max-width: 92vw; }
    .famille { display: flex; flex-direction: column; gap: var(--sp-3); }

    /* Le lanceur n'a pas de pied de page bordé : juste l'ornement de clôture. */
    .cloture { border: 0; padding-top: var(--sp-6); }
  </style>
</head>
<body>

  <p class="ornement" aria-hidden="true">✦ ✦ ✦</p>

      <a href="/la-fin-du-monde-16h53/" class="btn"><span><span aria-hidden="true">✦&nbsp;</span>La fin du monde, c'est pour demain ; à 16h53</span></a>
      <a href="/tableemeraude/" class="btn"><span><span aria-hidden="true">✦&nbsp;</span>La Table d'Émeraude</span></a>
