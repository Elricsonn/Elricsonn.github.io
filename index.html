<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elricsonn — Portail</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cinzel+Decorative:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #000;
      background-image: radial-gradient(ellipse at center, #1a1a1a 0%, #000 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
      font-family: 'Cinzel', serif;
      color: #c9a84c;
    }

    .ornament {
      font-size: 1.2rem;
      letter-spacing: 0.8em;
      color: #8a6a2a;
      margin-bottom: 1.4rem;
    }

    h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 2rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #c9a84c;
      text-shadow: 0 0 20px rgba(201,168,76,0.3);
      margin-bottom: 0.6rem;
      text-align: center;
    }

    .subtitle {
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #8a6a2a;
      margin-bottom: 2rem;
      font-variant: small-caps;
    }

    .separator {
      width: 200px;
      height: 1px;
      background: linear-gradient(to right, transparent, #8a6a2a, transparent);
      margin: 0 auto 2.2rem;
    }

    .portail {
      background: rgba(30, 20, 8, 0.85);
      border: 1px solid #5a3e1b;
      padding: 2.2rem 2.6rem;
      width: 400px;
      max-width: 92vw;
      display: flex;
      flex-direction: column;
      gap: 1.7rem;
    }

    /* — Familles thématiques — */
    .groupe {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .groupe-titre {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #8a6a2a;
      font-variant: small-caps;
      text-align: center;
      margin-bottom: 0.25rem;
    }
    .groupe-titre::before,
    .groupe-titre::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, #5a3e1b, transparent);
    }

    .btn {
      display: block;
      width: 100%;
      padding: 0.72rem 1rem;
      background: transparent;
      border: 1px solid #5a3e1b;
      color: #c9a84c;
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.3s, border-color 0.3s;
    }
    .btn:hover {
      background: rgba(201,168,76,0.1);
      border-color: #c9a84c;
    }
    .btn.disabled {
      opacity: 0.35;
      cursor: default;
      pointer-events: none;
    }

    .footer-ornament {
      margin-top: 2.4rem;
      font-size: 1rem;
      color: #5a3e1b;
    }
  </style>
</head>
<body>

  <div class="ornament">✦ ✦ ✦</div>

  <h1>Elricsonn</h1>
  <p class="subtitle">Portail Principal</p>
  <div class="separator"></div>

  <nav class="portail">

    <div class="groupe">
      <p class="groupe-titre">Voie &amp; Tradition</p>
      <a href="https://elricsonn.github.io/loge-rer" class="btn">✦ Loge RER — Rite Écossais Rectifié</a>
      <a href="https://elricsonn.github.io/atelier-du-blason" class="btn">✦ L'Atelier du Blason</a>
    </div>

    <div class="groupe">
      <p class="groupe-titre">Écrits &amp; Récits</p>
      <a href="https://elricsonn.github.io/le-7e-initie" class="btn">✦ Le 7e initié — Roman</a>
      <a href="https://elricsonn.github.io/chestel-combat" class="btn">✦ Chestel Combat — Silent Hill</a>
    </div>

    <div class="groupe">
      <p class="groupe-titre">Regard &amp; Monde</p>
      <a href="https://elricsonn.github.io/tableemeraude" class="btn">✦ La Table d'Émeraude</a>
      <a href="https://elricsonn.github.io/lamargottiere" class="btn">✦ La Margottière</a>
    </div>

    <div class="groupe">
      <p class="groupe-titre">Sic Gloria Mundi</p>
      <a href="https://elricsonn.github.io/la-fin-du-monde-16h53" class="btn">✦ La fin du monde… à 16h53</a>
    </div>

  </nav>

  <div class="footer-ornament">✦</div>

</body>
</html>
